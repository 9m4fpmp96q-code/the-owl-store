<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Página no encontrada — OWL Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#f7f6f3;color:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
    .box{text-align:center;padding:48px 32px;max-width:480px}
    .owl{font-size:80px;margin-bottom:24px;display:block}
    h1{font-size:clamp(28px,5vw,40px);font-weight:900;letter-spacing:-0.03em;margin-bottom:12px}
    p{font-size:16px;color:#888;line-height:1.7;margin-bottom:32px}
    a{display:inline-flex;align-items:center;gap:8px;background:#111;color:#fff;padding:16px 32px;border-radius:100px;text-decoration:none;font-weight:700;font-size:15px;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
    a:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.22)}
  </style>
</head>
<body>
  <div class="box">
    <span class="owl">🦉</span>
    <h1>Página no encontrada</h1>
    <p>Parece que esta página no existe o fue movida. Vuelve a la tienda y encuentra tu pack OWL perfecto.</p>
    <a href="/">← Volver a la tienda</a>
  </div>
</body>
</html>
